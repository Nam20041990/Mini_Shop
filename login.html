<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Mini Shop</title>
  <meta name="description" content="Trang đăng nhập tài khoản Mini Shop.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Reusable Header Component -->
  <div id="site-header"></div>

  <!-- Main Content -->
  <main class="auth-main-wrapper">
    <div class="container">
      <div class="auth-card-container">
        
        <!-- Auth Header Tabs -->
        <div class="auth-card-header">
          <div class="auth-tabs">
            <a href="login.html" class="auth-tab-btn active">Đăng Nhập</a>
            <a href="register.html" class="auth-tab-btn">Đăng Ký</a>
          </div>
        </div>

        <div class="auth-card-body">
          <div class="auth-intro">
            <h1 class="auth-title">Chào mừng trở lại!</h1>
            <p class="auth-subtitle">Nhập thông tin đăng nhập hoặc sử dụng tài khoản thử nghiệm bên dưới.</p>
          </div>

          <!-- Alert message box -->
          <div id="authAlert" class="auth-alert" style="display: none;"></div>

          <!-- Quick Demo Login Section (1-Click) -->
          <div class="quick-demo-section">
            <div class="quick-demo-title">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
              <span>Thử nghiệm 1-Click (Đăng nhập Nhanh)</span>
            </div>
            <div class="quick-demo-grid">
              <button type="button" class="btn-demo-account demo-customer" id="btnDemoCustomer">
                <div class="demo-icon">👤</div>
                <div class="demo-text">
                  <strong>Tài khoản Khách</strong>
                  <small>khachhang@gmail.com / user123</small>
                </div>
                <span class="demo-badge">Vào Trang Khách</span>
              </button>

              <button type="button" class="btn-demo-account demo-admin" id="btnDemoAdmin">
                <div class="demo-icon">🛡️</div>
                <div class="demo-text">
                  <strong>Tài khoản Admin</strong>
                  <small>admin@minishop.com / admin123</small>
                </div>
                <span class="demo-badge admin">Vào Khu Quản Trị</span>
              </button>
            </div>
          </div>

          <div class="auth-divider">
            <span>hoặc đăng nhập thủ công</span>
          </div>

          <!-- Login Form -->
          <form id="loginForm" class="auth-form" novalidate>
            <div class="form-group">
              <label for="emailInput" class="form-label">Địa chỉ Email</label>
              <div class="input-with-icon">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                <input type="email" id="emailInput" class="form-control" placeholder="nhapemail@example.com" required>
              </div>
            </div>

            <div class="form-group">
              <div class="label-row">
                <label for="passwordInput" class="form-label">Mật khẩu</label>
                <a href="#" class="forgot-link" onclick="alert('Tính năng quên mật khẩu thử nghiệm: Dùng tài khoản demo admin@minishop.com (pass: admin123) hoặc khachhang@gmail.com (pass: user123)'); return false;">Quên mật khẩu?</a>
              </div>
              <div class="input-with-icon">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                <input type="password" id="passwordInput" class="form-control" placeholder="••••••••" required>
                <button type="button" class="btn-toggle-password" id="togglePasswordBtn" aria-label="Hiện mật khẩu">
                  <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
              </div>
            </div>

            <div class="form-options">
              <label class="checkbox-container">
                <input type="checkbox" id="rememberMeCheckbox" checked>
                <span class="checkmark"></span>
                <span class="checkbox-label">Ghi nhớ đăng nhập</span>
              </label>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitLoginBtn">
              <span>Đăng Nhập</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>
          </form>

          <div class="auth-footer-note">
            <span>Chưa có tài khoản?</span>
            <a href="register.html" class="auth-accent-link">Đăng ký tài khoản mới</a>
          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- Reusable Footer Component -->
  <div id="site-footer"></div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Scripts -->
  <script src="js/products-data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components/header.js"></script>
  <script src="js/components/footer.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
