<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giỏ hàng - Mini Shop</title>
  <meta name="description" content="Quản lý và xem lại các sản phẩm trong giỏ hàng của bạn tại Mini Shop.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Reusable Header Component Injection Point -->
  <div id="site-header"></div>

  <!-- Main Content Wrapper -->
  <main class="cart-page">
    <div class="container">
      
      <!-- Breadcrumb Navigation -->
      <nav class="breadcrumb-nav" aria-label="Breadcrumb">
        <ul class="breadcrumb">
          <li><a href="index.html">Trang chủ</a></li>
          <li class="breadcrumb-separator">&gt;</li>
          <li><a href="products.html">Sản phẩm</a></li>
          <li class="breadcrumb-separator">&gt;</li>
          <li class="breadcrumb-current">Giỏ hàng</li>
        </ul>
      </nav>

      <!-- Cart Section Header -->
      <div class="cart-page-header">
        <h1 class="cart-page-title">
          <span>Giỏ hàng của bạn</span>
          <span class="cart-title-count" id="cartTitleCount">(0 sản phẩm)</span>
        </h1>
        <a href="products.html" class="continue-shopping-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Tiếp tục mua sắm</span>
        </a>
      </div>

      <!-- Main Cart Layout Grid (Items List on Left, Summary on Right) -->
      <div class="cart-layout-grid">
        <!-- Left: Cart Items List -->
        <div class="cart-main-section" id="cartItemsList">
          <!-- Dynamically populated via js/cart-page.js -->
        </div>

        <!-- Right: Order Summary Sidebar -->
        <div class="cart-sidebar-section" id="cartSummaryContent">
          <!-- Dynamically populated via js/cart-page.js -->
        </div>
      </div>

    </div>
  </main>

  <!-- Reusable Footer Component Injection Point -->
  <div id="site-footer"></div>

  <!-- Cart Notification Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Scripts -->
  <script src="js/products-data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components/header.js"></script>
  <script src="js/components/footer.js"></script>
  <script src="js/cart-page.js"></script>
</body>
</html>
