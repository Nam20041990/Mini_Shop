<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh sách yêu thích - Mini Shop</title>
  <meta name="description" content="Xem và quản lý các sản phẩm bạn đã yêu thích tại Mini Shop.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Reusable Header Component Injection Point -->
  <div id="site-header"></div>

  <!-- Main Content Wrapper -->
  <main class="wishlist-page">
    <div class="container">
      
      <!-- Breadcrumb Navigation -->
      <nav class="breadcrumb-nav" aria-label="Breadcrumb">
        <ul class="breadcrumb">
          <li><a href="index.html">Trang chủ</a></li>
          <li class="breadcrumb-separator">&gt;</li>
          <li><a href="products.html">Sản phẩm</a></li>
          <li class="breadcrumb-separator">&gt;</li>
          <li class="breadcrumb-current">Danh sách yêu thích</li>
        </ul>
      </nav>

      <!-- Wishlist Section Header -->
      <div class="wishlist-page-header">
        <h1 class="wishlist-page-title">
          <span>Sản phẩm yêu thích</span>
          <span class="wishlist-title-count" id="wishlistTitleCount">(0 sản phẩm)</span>
        </h1>
        <a href="products.html" class="continue-shopping-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Tiếp tục mua sắm</span>
        </a>
      </div>

      <!-- Main Wishlist Layout -->
      <div class="wishlist-main-section" id="wishlistGrid">
        <!-- Dynamically populated via js/wishlist-page.js -->
      </div>

    </div>
  </main>

  <!-- Reusable Footer Component Injection Point -->
  <div id="site-footer"></div>

  <!-- Notification Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Scripts -->
  <script src="js/products-data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components/header.js"></script>
  <script src="js/components/footer.js"></script>
  <script src="js/wishlist-page.js"></script>
</body>
</html>
